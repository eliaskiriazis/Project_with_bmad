{% extends 'base.html' %}
{% block content %}
<section class="wrap auth-shell">
    <div class="auth-layout">
        <aside class="auth-story-panel">
            <p class="eyebrow">{{ tr('The players’ marketplace') }}</p>
            <h2>{{ tr('Good instruments. New stories.') }}</h2>
            <p>{{ tr('A considered collection of electric guitars, chosen for the next chapter.') }}</p>
        </aside>
        <div class="auth-form-panel">
            <h1>{{ tr('Login') }}</h1>
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <label>{{ tr('Email') }}<input type="email" name="email" autocomplete="email" required></label>
                <label>{{ tr('Password') }}<input type="password" name="password" autocomplete="current-password" required></label>
                <button type="submit">{{ tr('Login') }}</button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
