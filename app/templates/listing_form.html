{% extends 'base.html' %}
{% block content %}
<section class="wrap">
    <h1>{{ tr('Sell a guitar') }}</h1>
    <form method="POST" enctype="multipart/form-data" class="stacked-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>{{ tr('Title') }}<input type="text" name="title" maxlength="180" required></label>
        <label>{{ tr('Brand') }}<input type="text" name="brand" maxlength="80" required></label>
        <label>{{ tr('Model') }}<input type="text" name="model" maxlength="100" required></label>
        <label>{{ tr('Condition') }}<select name="condition"><option value="Excellent">{{ tr('Excellent') }}</option><option value="Very Good">{{ tr('Very Good') }}</option><option value="Good">{{ tr('Good') }}</option><option value="Fair">{{ tr('Fair') }}</option></select></label>
        <label class="checkbox-label"><input type="checkbox" name="electric_guitar" value="yes" required> {{ tr('I confirm this is a used electric guitar.') }}</label>
        <label>{{ tr('Description') }}<textarea name="description" maxlength="5000" required></textarea></label>
        <label>{{ tr('Price EUR') }}<input type="number" min="0.01" step="0.01" name="price" required></label>
        <label>{{ tr('Shipping fee EUR') }}<input type="number" min="0" step="0.01" name="shipping_fee" value="0"></label>
        <label>{{ tr('Fulfillment') }}<select name="fulfillment"><option value="pickup">{{ tr('Pickup') }}</option><option value="shipping">{{ tr('Shipping') }}</option><option value="shipping_or_pickup">{{ tr('Shipping or pickup') }}</option></select></label>
        <label>{{ tr('Photos') }}<input type="file" name="photos" multiple accept="image/png,image/jpeg,image/webp" required></label>
        <p>{{ tr('Do not include serial numbers or personal details in photos.') }}</p>
        <button type="submit">{{ tr('Publish') }}</button>
    </form>
</section>
{% endblock %}
